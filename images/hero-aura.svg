<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="glowTeal" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2c7a7b" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#123c40" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b1416" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .ring-outer { transform-origin: 210px 210px; animation: rotCW 36s linear infinite; }
    .ring-mid { transform-origin: 210px 210px; animation: rotCCW 24s linear infinite; }
    .ring-pulse { transform-origin: 210px 210px; animation: pulseRing 5s ease-in-out infinite; }
    @keyframes rotCW { to { transform: rotate(360deg); } }
    @keyframes rotCCW { to { transform: rotate(-360deg); } }
    @keyframes pulseRing {
      0%, 100% { transform: scale(0.97); opacity: 0.45; }
      50% { transform: scale(1.03); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring-outer, .ring-mid, .ring-pulse { animation: none !important; }
    }
  </style>
  <circle cx="210" cy="210" r="196" fill="url(#glowTeal)"/>
  <circle cx="210" cy="210" r="184" stroke="#68b5ad" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 10" class="ring-outer"/>
  <circle cx="210" cy="210" r="158" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="26 14 4 14" class="ring-mid"/>
  <circle cx="210" cy="210" r="134" stroke="#a7d7d2" stroke-opacity="0.16" stroke-width="1" class="ring-pulse"/>
  <!-- Orbiting subtle nodes -->
  <g class="ring-outer">
    <circle cx="210" cy="26" r="4" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="394" cy="210" r="3" fill="#81e6d9" fill-opacity="0.8"/>
  </g>
  <g class="ring-mid">
    <circle cx="210" cy="368" r="3.5" fill="#81e6d9" fill-opacity="0.75"/>
    <circle cx="52" cy="210" r="2.8" fill="#fbbf24" fill-opacity="0.7"/>
  </g>
</svg>
